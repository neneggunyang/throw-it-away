<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쓰레기는 쓰레기통에.</title>
<style>
:root{--paper:#f3ebdd;--ink:#292825;--brown:#8d7255;--line:#d8cbb7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 10%,#f5f7fa55 0,transparent 44%),repeating-linear-gradient(93deg,#454d5807 0 1px,transparent 1px 5px),#aeb5bd;color:var(--ink);font-family:Georgia,"Noto Serif KR","Batang",serif;display:flex;justify-content:center;align-items:center;padding:24px 14px}
.app{width:min(100%,900px);display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:28px;align-items:center}
.header{grid-column:1/-1;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;gap:8px;border-bottom:1px solid #4b454038;padding:0 2px 14px}
.brand{font-size:22px;font-weight:800;letter-spacing:.04em;color:#515963}.date{font-size:12px;color:#747e89}
.desk{position:relative;min-width:0}
.paper{position:relative;min-height:485px;padding:30px 30px 26px 54px;background:repeating-linear-gradient(to bottom,transparent 0 31px,#8b9fa43b 31px 32px),linear-gradient(90deg,transparent 0 39px,#bb6a5c59 39px 40px,transparent 40px),var(--paper);box-shadow:4px 8px 18px #3f2e2c2b,inset 0 0 30px #8667410f;transform:rotate(-.5deg);overflow:hidden}
.paper-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#718092;letter-spacing:.08em;margin-bottom:15px}
textarea{display:block;width:100%;height:310px;resize:none;border:0;outline:0;background:transparent;color:#302d29;font:17px/32px "Malgun Gothic","맑은 고딕",Dotum,"돋움",Arial,sans-serif;position:relative;z-index:1;padding:0 2px}
textarea::placeholder{color:#929eac}
.paper-footer{font-size:13.5px;color:#8793a2;display:block;width:max-content;max-width:100%;margin-top:12px;padding:0 2px;line-height:1.35;letter-spacing:-.065em}.paper-footer .quote{display:block;white-space:nowrap;letter-spacing:-.065em;font-size:13.5px;line-height:1.35}.paper-footer .source{display:block;text-align:right;width:100%;font-size:10px;color:#929daa;margin-top:7px;line-height:1.2;letter-spacing:-.045em;padding-left:0;padding-right:0;box-sizing:border-box}
#writtenLines{display:none;position:relative;z-index:2;height:310px;overflow:hidden;font:17px/32px "Malgun Gothic","맑은 고딕",Dotum,"돋움",Arial,sans-serif;color:#302d29;padding:0 2px;white-space:normal}
.text-line{height:32px;line-height:32px;position:relative;white-space:pre;overflow:visible;width:100%}
.text-line .actual{display:inline-block;white-space:pre;max-width:100%;overflow:hidden;vertical-align:top}
.text-line .blackout{position:absolute;left:0;top:5px;height:22px;width:0;background:#11110f;z-index:3;box-shadow:1px 0 0 #111;transition:width .34s cubic-bezier(.22,.75,.24,1)}
.text-line.covered .blackout{width:var(--cover-width,100%)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:19px}
.action-buttons{display:flex;align-items:center;gap:8px}
.hint{font-size:12px;font-weight:700;color:#626d7a;line-height:1.65}
button{font:inherit;cursor:pointer}
.throw-btn{border:1px solid #424952;background:#454b54;color:#f0f2f5;padding:13px 20px;letter-spacing:.04em;box-shadow:2px 3px 0 #3a2b1d2e}
.throw-btn:hover{background:#51483b}.throw-btn:disabled{opacity:.5;cursor:wait}
.sound-btn{position:fixed;top:12px;right:12px;z-index:50;border:1px solid #7f8994;background:#dce2e8;color:#46515d;padding:5px 7px;font-size:10px;line-height:1.2;border-radius:4px;white-space:nowrap;box-shadow:1px 2px 0 #343e4818}.sound-btn:hover{background:#cbd5df}.sound-btn[aria-pressed="true"]{background:#b8c4d0;color:#37434f}
.basket-area{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.basket-label{font-size:12px;color:#626c78;letter-spacing:.1em}
.basket{width:145px;height:174px;position:relative;filter:drop-shadow(5px 8px 5px #3627182e);transform:perspective(400px) rotateY(-7deg)}
.basket-body{position:absolute;top:8px;bottom:0;left:8px;right:8px;border-left:5px solid #424852;border-right:5px solid #424852;border-bottom:6px solid #424852;border-radius:0 0 12px 12px;background:repeating-linear-gradient(0deg,transparent 0 10px,#303741c7 10px 13px,transparent 13px 19px),repeating-linear-gradient(90deg,transparent 0 10px,#303741d9 10px 13px,transparent 13px 19px),linear-gradient(90deg,#ffffff24,transparent 25%,#0000001a 80%);clip-path:polygon(0 0,100% 0,86% 100%,14% 100%)}
.basket-rim{position:absolute;left:0;right:0;top:0;height:19px;border:5px solid #353631;border-radius:50%;z-index:4}
.basket-papers{position:absolute;bottom:10px;left:20px;right:20px;height:18px;z-index:1;opacity:.8;background:radial-gradient(ellipse at 25% 45%,#eee0c8 0 18%,transparent 19%),radial-gradient(ellipse at 55% 55%,#d6c5aa 0 21%,transparent 22%),radial-gradient(ellipse at 76% 43%,#f4e8d3 0 18%,transparent 19%);transition:height .3s}
.basket.pulse{animation:basket-bump .34s ease-out}
@keyframes basket-bump{0%{transform:perspective(400px) rotateY(-7deg) translateY(0)}45%{transform:perspective(400px) rotateY(-7deg) translateY(5px) rotate(2deg)}100%{transform:perspective(400px) rotateY(-7deg) translateY(0)}}
.flying-ball{position:fixed;z-index:20;width:62px;height:58px;border-radius:48% 42% 50% 43%;background:radial-gradient(circle at 30% 25%,#fff4e0 0 12%,transparent 14%),repeating-linear-gradient(35deg,#d4c3a7 0 4px,#f2e6d1 4px 8px,#bca88a 8px 10px);box-shadow:inset -7px -6px 10px #62513a55,2px 5px 9px #3528194a;transform:scale(.3);opacity:0;pointer-events:none}
.flying-ball.go{animation:throw-ball .78s cubic-bezier(.4,.05,.8,.5) forwards}
@keyframes throw-ball{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}45%{opacity:1;transform:translate(calc(var(--dx)*.48),calc(var(--dy)*.3 - 42px)) scale(.82) rotate(150deg)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.18) rotate(440deg)}}
.paper.shrinking{animation:paper-crumple .8s cubic-bezier(.48,.05,.8,.3) forwards;transform-origin:53% 50%}
@keyframes paper-crumple{0%{transform:rotate(-.5deg) scale(1);border-radius:0;filter:none}30%{transform:rotate(3deg) scale(.84,.9) skew(-2deg);filter:contrast(1.12)}65%{transform:rotate(-9deg) scale(.45,.52) skew(7deg);border-radius:35%;filter:contrast(1.35)}100%{transform:rotate(12deg) scale(.08,.1);border-radius:48%;opacity:0;filter:contrast(1.5)}}
.toast{min-height:25px;text-align:center;font-size:15px;font-weight:700;color:#414a55;letter-spacing:.02em;margin-top:2px;line-height:1.4}
.small-note{font-size:10px;color:#737d89;text-align:center;line-height:1.6;max-width:160px}
@media(max-width:620px){body{padding:16px 12px;align-items:flex-start}.app{grid-template-columns:minmax(0,1fr);gap:18px}.header{grid-column:1}.paper{min-height:445px;padding:24px 18px 22px 43px}textarea,#writtenLines{height:300px;font-size:16px;line-height:32px}.text-line{height:32px;line-height:32px}.text-line .blackout{height:21px;top:5px}.basket-area{flex-direction:row;justify-content:center;gap:15px}.basket{width:75px;height:90px;transform:scale(.72);transform-origin:center}.basket-body{border-width:3px;top:5px;border-radius:0 0 6px 6px;background:repeating-linear-gradient(0deg,transparent 0 6px,#424852 6px 8px,transparent 8px 12px),repeating-linear-gradient(90deg,transparent 0 6px,#424852 6px 8px,transparent 8px 12px)}.basket-rim{height:11px;border-width:3px}.basket-papers{bottom:5px;height:12px}.small-note{max-width:180px;text-align:left}.controls{align-items:flex-end}.action-buttons{gap:6px;flex-wrap:wrap;justify-content:flex-end}.sound-btn{top:9px;right:9px;padding:5px 6px;font-size:10px}.throw-btn{padding:12px 15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Final palette correction: remove the lingering yellow/brown cast from all paper-ball states. */
.paper-ball-decoration,
.crumpled-paper-result,
.flying-ball {
  filter: grayscale(.82) saturate(.22) sepia(0) hue-rotate(0deg) !important;
}
.paper-ball-decoration { filter: grayscale(.82) saturate(.22) sepia(0) drop-shadow(1px 3px 2px #30394424) !important; }
.crumpled-paper-result { filter: grayscale(.82) saturate(.22) sepia(0) drop-shadow(2px 5px 3px #30394430) !important; }
.flying-ball {
  background: radial-gradient(circle at 30% 25%, #f2f4f6 0 12%, transparent 14%),
    repeating-linear-gradient(35deg, #aeb7c1 0 4px, #d8dde3 4px 8px, #929daa 8px 10px) !important;
  box-shadow: inset -7px -6px 10px #39434f45, 2px 5px 9px #30394435 !important;
}

</style>
</head>
<body>
<button class="sound-btn" id="soundToggle" type="button" aria-pressed="false" aria-label="소리 끄기">🔊 소리 켜짐</button>
<main class="app">
<header class="header"><div class="brand">쓰레기는 쓰레기통에.</div><div class="hint">어디에도 저장되지 않아.<br>어딘가로 싸그리 날려버렸어.</div></header>
<section class="desk">
 <div class="paper" id="paper">
  <div class="paper-top"><span id="paperToday"></span></div>
  <textarea id="entry" aria-label="오늘의 감정" placeholder="아무데도 차마 남기지 못하는 말,&#10;마음에 담아둔 크고 작은 일들,&#10;여기에 모조리 털어놔도 괜찮아.&#10;속에 있는 거 훌훌 털어버리고 나면&#10;마음이 한결 나아질지도 모르지." spellcheck="false"></textarea>
  <div id="writtenLines" aria-hidden="true"></div>
  <div class="paper-footer"><span class="quote">“마음이 힘든 건 약해서가 아니라, 너무 많이 붙잡고 있기 때문이다.”</span><span class="source">— 《석가모니가 아들러를 만났을 때》 중에서</span></div>
 </div>
 <div class="controls"><div class="action-group"><div class="action-buttons"><button class="throw-btn" id="throwBtn">🚮 털어버리기</button></div></div></div>
</section>
<aside class="basket-area"><div class="basket" id="basket" aria-label="철망 휴지통"><div class="basket-body"></div><div class="basket-papers" id="basketPapers"></div><div class="basket-rim"></div></div><div class="toast" id="toast" aria-live="polite"></div></aside>
</main>
<script>
const paper=document.getElementById('paper'),entry=document.getElementById('entry'),linesEl=document.getElementById('writtenLines'),btn=document.getElementById('throwBtn'),basket=document.getElementById('basket'),basketPapers=document.getElementById('basketPapers'),toast=document.getElementById('toast');
document.getElementById('paperToday').textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let busy=false,paperCount=0,audioCtx=null,soundEnabled=true;
const soundToggle=document.getElementById('soundToggle');
soundToggle.addEventListener('click',()=>{soundEnabled=!soundEnabled;soundToggle.textContent=soundEnabled?'🔊 소리 켜짐':'🔇 소리 꺼짐';soundToggle.setAttribute('aria-pressed',String(!soundEnabled));soundToggle.setAttribute('aria-label',soundEnabled?'소리 끄기':'소리 켜기');});
function getAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx?.state==='suspended')audioCtx.resume();return audioCtx}
function noiseBurst(duration,volume,filterFreq,delay=0,pan=0){
 if(!soundEnabled)return;
 volume=Math.min(volume*0.16,0.075);
 const c=getAudio();if(!c)return;const length=Math.floor(c.sampleRate*duration),buffer=c.createBuffer(1,length,c.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<length;i++){const t=i/length;const env=Math.pow(1-t,1.1)*(0.55+Math.random()*.45);data[i]=(Math.random()*2-1)*env}
 const src=c.createBufferSource();src.buffer=buffer;const filter=c.createBiquadFilter();filter.type='bandpass';filter.frequency.value=filterFreq;filter.Q.value=.45;
 const gain=c.createGain();gain.gain.setValueAtTime(.0001,c.currentTime+delay);gain.gain.exponentialRampToValueAtTime(volume,c.currentTime+delay+.012);gain.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+duration);
 const p=c.createStereoPanner?c.createStereoPanner():null;if(p){p.pan.value=pan;src.connect(filter);filter.connect(gain);gain.connect(p);p.connect(c.destination)}else{src.connect(filter);filter.connect(gain);gain.connect(c.destination)}
 src.start(c.currentTime+delay);src.stop(c.currentTime+delay+duration+.025)
}
function maskSound(){
 if(!soundEnabled)return;
 // A short, dry marker-on-paper swish for each black masking stroke.
 const c=getAudio(); if(!c)return;
 const duration=0.105, now=c.currentTime;
 const buffer=c.createBuffer(1,Math.ceil(c.sampleRate*duration),c.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++){
   const t=i/data.length;
   const envelope=Math.sin(Math.PI*t)**0.7;
   data[i]=(Math.random()*2-1)*envelope;
 }
 const src=c.createBufferSource();src.buffer=buffer;
 const band=c.createBiquadFilter();band.type='bandpass';band.frequency.value=1650+Math.random()*450;band.Q.value=0.65;
 const high=c.createBiquadFilter();high.type='highpass';high.frequency.value=650;
 const gain=c.createGain();
 gain.gain.setValueAtTime(0.0001,now);
 gain.gain.linearRampToValueAtTime(0.042,now+0.012);
 gain.gain.exponentialRampToValueAtTime(0.0001,now+duration);
 src.connect(high);high.connect(band);band.connect(gain);gain.connect(c.destination);
 src.start(now);src.stop(now+duration+0.01);
}
function crinkleSound(){
  if(!soundEnabled)return;
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return;
  const c=new Ctx(); if(c.state==='suspended') c.resume();
  const master=c.createGain(); master.gain.value=0.16; master.connect(c.destination);
  // Quiet, dry paper rustle lasting about 2.3 seconds, with no low bin-like thump.
  for(let i=0;i<62;i++){
    const start=c.currentTime+i*0.036;
    const len=0.045+Math.random()*0.07;
    const buffer=c.createBuffer(1,Math.ceil(c.sampleRate*len),c.sampleRate);
    const data=buffer.getChannelData(0);
    for(let j=0;j<data.length;j++) data[j]=(Math.random()*2-1)*Math.sin(Math.PI*j/data.length);
    const src=c.createBufferSource();src.buffer=buffer;
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=2200+Math.random()*1800;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7200;
    const g=c.createGain();g.gain.value=0.09+Math.random()*0.07;
    src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(master);
    src.start(start);src.stop(start+len);
  }
  for(let i=0;i<7;i++){
    const start=c.currentTime+i*0.29, len=0.18;
    const buffer=c.createBuffer(1,Math.ceil(c.sampleRate*len),c.sampleRate);
    const data=buffer.getChannelData(0);
    for(let j=0;j<data.length;j++) data[j]=(Math.random()*2-1)*Math.sin(Math.PI*j/data.length);
    const src=c.createBufferSource();src.buffer=buffer;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.7;
    const g=c.createGain();g.gain.value=.045;
    src.connect(f);f.connect(g);g.connect(master);src.start(start);src.stop(start+len);
  }
  setTimeout(()=>{try{c.close()}catch(e){}},3000);
}
function binSound(){
  if(!soundEnabled)return;
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return;
  const c=new Ctx(); if(c.state==='suspended') c.resume();
  const master=c.createGain(); master.gain.value=0.62; master.connect(c.destination);
  const now=c.currentTime;
  // Clearly separate short hollow bin rattle at impact, with a little metallic ring.
  [0,.085,.17].forEach((delay,i)=>{
    const osc=c.createOscillator(),g=c.createGain();
    osc.type='triangle';
    osc.frequency.setValueAtTime(230-i*25,now+delay);
    osc.frequency.exponentialRampToValueAtTime(105,now+delay+.18);
    g.gain.setValueAtTime(.0001,now+delay);
    g.gain.exponentialRampToValueAtTime(i===0?.26:.17,now+delay+.01);
    g.gain.exponentialRampToValueAtTime(.0001,now+delay+.22);
    osc.connect(g);g.connect(master);osc.start(now+delay);osc.stop(now+delay+.23);
  });
  const len=.13,buffer=c.createBuffer(1,Math.ceil(c.sampleRate*len),c.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/data.length*7);
  const noise=c.createBufferSource();noise.buffer=buffer;
  const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=1100;
  const g=c.createGain();g.gain.value=.17;
  noise.connect(hp);hp.connect(g);g.connect(master);noise.start(now);noise.stop(now+len);
  setTimeout(()=>{try{c.close()}catch(e){}},1000);
}
function wrapText(text,availableWidth,font){
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');ctx.font=font;
 const result=[];const paragraphs=text.split('\n');
 for(let p=0;p<paragraphs.length;p++){
  const para=paragraphs[p];if(para===''){result.push(' ');continue}
  let line='';
  for(const ch of para){if(line && ctx.measureText(line+ch).width>availableWidth){result.push(line);line=ch}else line+=ch}
  result.push(line||' ');
 }
 return result;
}
function renderLineByLineMask(text){
 linesEl.innerHTML='';const style=getComputedStyle(entry);const availableWidth=entry.clientWidth-4;
 const font=style.font;const lines=wrapText(text,availableWidth,font);
 lines.forEach((line,i)=>{
  const row=document.createElement('div');row.className='text-line';
  const actual=document.createElement('span');actual.className='actual';actual.textContent=line;
  const blackout=document.createElement('span');blackout.className='blackout';
  row.append(actual,blackout);linesEl.append(row);
 });
 entry.style.display='none';linesEl.style.display='block';
 // measure each real line's visible text width; black bar covers the handwritten line itself.
 requestAnimationFrame(()=>{[...linesEl.children].forEach(row=>{const actual=row.querySelector('.actual');row.style.setProperty('--cover-width',Math.max(actual.getBoundingClientRect().width+8,18)+'px')})});
 return lines.length;
}
function resetWritingSurface(){entry.style.display='block';linesEl.style.display='none';linesEl.innerHTML='';paper.classList.remove('shrinking');}
function confirmDiscard(){return window.confirm('이 페이지를 털어버릴까?\n버린 글은 복구할 수 없어.')}
btn.addEventListener('click',()=>{
 if(busy)return;if(!entry.value.trim()){toast.textContent='아직 버릴게 없어.';entry.focus();return}if(!confirmDiscard())return;
 busy=true;btn.disabled=true;toast.textContent='';getAudio();
 const text=entry.value;const lineCount=renderLineByLineMask(text);
 const rows=[...linesEl.children];
 // One by one: actual user-entered text is visibly covered line-by-line with black ink.
 rows.forEach((row,i)=>setTimeout(()=>{row.classList.add('covered');maskSound()},i*220+100));
 const maskDuration=(lineCount-1)*220+720;
 // After the last line is obscured, crumple the page and play a distinct paper-crinkle sequence.
 setTimeout(()=>{paper.classList.add('shrinking');crinkleSound()},maskDuration+650);
 // Then the paper ball is visibly thrown into the wire bin, with a separate impact/rustle.
 setTimeout(()=>{
  // The faceted-paper overlay performs the flight. Do not create the old round CSS ball.
  binSound();basket.classList.add('pulse');
  setTimeout(()=>{basket.classList.remove('pulse');paperCount++;basketPapers.style.height=Math.min(18+paperCount*6,60)+'px'},500);
 },maskDuration+650+1820);
 setTimeout(()=>{
  entry.value='';resetWritingSurface();busy=false;btn.disabled=false;toast.textContent='감정 쓰레기 폐기 완료';entry.focus();
 },maskDuration+650+1820+750);
});
entry.addEventListener('input',()=>{if(!busy)toast.textContent=''});
window.addEventListener('pagehide',()=>{entry.value=''});
</script>

<style>
/* 수정: 메모지 자체가 둥글게 말리는 대신, 각진 접힘 윤곽으로 단계적으로 붕괴 */
.paper.shrinking{
  animation: paper-angular-collapse 1.55s cubic-bezier(.42,.02,.72,.32) forwards!important;
  transform-origin:53% 50%;
  will-change:transform,clip-path,opacity,filter;
}
@keyframes paper-angular-collapse{
  0%{
    transform:rotate(-.5deg) scale(1,1);
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
    opacity:1;filter:none;
  }
  22%{
    transform:rotate(1.5deg) scale(.91,.94) skew(-1deg,0);
    clip-path:polygon(0 3%,22% 0,41% 4%,62% 0,82% 3%,100% 0,97% 25%,100% 48%,96% 70%,100% 98%,74% 96%,53% 100%,31% 96%,9% 100%,3% 76%,0 52%,4% 28%);
    opacity:1;filter:contrast(1.12);
  }
  48%{
    transform:rotate(-7deg) scale(.68,.73) skew(4deg,-2deg);
    clip-path:polygon(5% 12%,24% 0,39% 16%,57% 2%,72% 14%,94% 5%,87% 29%,100% 43%,83% 58%,94% 79%,69% 75%,56% 100%,39% 82%,18% 96%,21% 70%,0 57%,13% 37%);
    opacity:1;filter:contrast(1.25) saturate(.8);
  }
  73%{
    transform:rotate(13deg) scale(.34,.39) skew(-8deg,3deg);
    clip-path:polygon(8% 19%,36% 0,52% 21%,77% 5%,94% 26%,78% 44%,100% 62%,70% 69%,61% 100%,39% 78%,14% 91%,21% 62%,0 44%);
    opacity:.94;filter:contrast(1.45) brightness(.97);
  }
  100%{

}

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const bin=document.getElementById('basket');
  if(bin){
    ['left','right'].forEach(side=>{
      if(!bin.querySelector('.paper-ball-decoration.'+side)){
        const ball=document.createElement('span');
        ball.className='paper-ball-decoration '+side;
        ball.setAttribute('aria-hidden','true');
        bin.appendChild(ball);
      }
    });
  }
});
</script>

        const fromX = window.innerWidth * .5 - 47;
